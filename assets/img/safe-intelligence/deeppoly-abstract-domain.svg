<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="DeepPoly abstract domain overview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162338"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 18px 'Segoe UI', system-ui, sans-serif; fill: #cfe2ff; }
      .h { font: 650 21px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .b { font: 400 15px 'Segoe UI', system-ui, sans-serif; fill: #dbeafe; }
      .m { font: 600 13px Consolas, 'Courier New', monospace; fill: #fde68a; }
      .cap-h { font: 650 20px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .cap { font: 400 15px 'Segoe UI', system-ui, sans-serif; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="180" fill="#1e40af" opacity="0.12"/>
  <circle cx="120" cy="660" r="220" fill="#0ea5e9" opacity="0.08"/>

  <text class="title" x="600" y="78" text-anchor="middle">DeepPoly: sound set propagation for certification</text>
  <text class="subtitle" x="600" y="114" text-anchor="middle">Reason over all admissible inputs at once, not sampled attacks.</text>

  <rect x="70" y="170" rx="18" ry="18" width="250" height="225" fill="url(#card)" stroke="#38bdf8" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="h" x="195" y="214" text-anchor="middle">Input set H</text>
  <text class="b" x="195" y="246" text-anchor="middle">Admissible perturbation region</text>
  <text class="b" x="195" y="267" text-anchor="middle">(for example L_inf around x0)</text>
  <text class="m" x="195" y="303" text-anchor="middle">H = { x | l_i &lt;= x_i &lt;= u_i }</text>
  <text class="b" x="195" y="336" text-anchor="middle">Single object: a set, not one point.</text>

  <rect x="375" y="145" rx="18" ry="18" width="450" height="275" fill="url(#card)" stroke="#a78bfa" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="h" x="600" y="191" text-anchor="middle">DeepPoly abstract domain</text>
  <text class="b" x="600" y="228" text-anchor="middle">Combine intervals and affine constraints</text>
  <text class="b" x="600" y="250" text-anchor="middle">to preserve useful dependencies.</text>
  <text class="m" x="600" y="287" text-anchor="middle">a_i^L(x_1,...,x_{i-1}) &lt;= x_i &lt;= a_i^U(...)</text>
  <text class="b" x="600" y="322" text-anchor="middle">Transformers: affine, ReLU, sigmoid, tanh, maxpool</text>
  <text class="b" x="600" y="348" text-anchor="middle">Sound under floating-point arithmetic.</text>

  <rect x="880" y="170" rx="18" ry="18" width="250" height="225" fill="url(#card)" stroke="#34d399" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="h" x="1005" y="214" text-anchor="middle">Output proof</text>
  <text class="b" x="1005" y="246" text-anchor="middle">Check target property</text>
  <text class="m" x="1005" y="282" text-anchor="middle">max_{x in H} c^T f(x) + b &lt;= 0</text>
  <text class="b" x="1005" y="317" text-anchor="middle">or class margin lower bounds</text>
  <text class="b" x="1005" y="338" text-anchor="middle">remain non-negative.</text>

  <path d="M320 282 L375 282" stroke="#7dd3fc" stroke-width="3.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M825 282 L880 282" stroke="#7dd3fc" stroke-width="3.2" fill="none" marker-end="url(#arrow)"/>

  <rect x="70" y="468" rx="18" ry="18" width="1060" height="184" fill="#091223" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text class="cap-h" x="600" y="513" text-anchor="middle">Why this is useful</text>
  <text class="cap" x="600" y="543" text-anchor="middle">Empirical testing asks whether one sampled attack succeeds.</text>
  <text class="cap" x="600" y="567" text-anchor="middle">Formal verification asks whether every x in H satisfies the property.</text>
  <text class="cap" x="600" y="591" text-anchor="middle">DeepPoly keeps this set reasoning both sound and scalable.</text>
</svg>
