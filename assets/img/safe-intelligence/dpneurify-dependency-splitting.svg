<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="DPNEURIFYFV dependency problem and splitting">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 700 32px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .sub { font: 400 18px 'Segoe UI', system-ui, sans-serif; fill: #d1d5db; }
      .h { font: 650 21px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .b { font: 400 15px 'Segoe UI', system-ui, sans-serif; fill: #e5e7eb; }
      .m { font: 600 14px Consolas, 'Courier New', monospace; fill: #fde68a; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="180" fill="#ef4444" opacity="0.08"/>
  <circle cx="120" cy="620" r="230" fill="#22c55e" opacity="0.07"/>
  <text class="title" x="600" y="80" text-anchor="middle">DPNEURIFYFV: preserve dependencies, split where needed</text>
  <text class="sub" x="600" y="116" text-anchor="middle">Precision comes from better symbolic structure plus branch-and-bound on uncertain regions.</text>

  <rect x="70" y="170" rx="18" ry="18" width="500" height="472" fill="#0b1220" stroke="#ef4444" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="h" x="320" y="216" text-anchor="middle">Left: dependency failure in intervals</text>
  <text class="m" x="320" y="258" text-anchor="middle">x in [0,1]</text>
  <text class="m" x="320" y="288" text-anchor="middle">x - x = 0 (exact)</text>
  <text class="m" x="320" y="318" text-anchor="middle">[0,1] - [0,1] = [-1,1] (interval view)</text>
  <text class="b" x="320" y="362" text-anchor="middle">The abstraction forgets both terms share the same x.</text>
  <text class="b" x="320" y="385" text-anchor="middle">Depth compounds this looseness across layers.</text>
  <circle cx="320" cy="520" r="62" fill="#7f1d1d" stroke="#f87171" stroke-width="3"/>
  <text x="289" y="513" font-family="'Segoe UI', system-ui, sans-serif" font-size="21" font-weight="650" fill="#f9fafb">x - x</text>
  <text x="280" y="540" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#fecaca">dependency lost</text>

  <rect x="630" y="170" rx="18" ry="18" width="500" height="472" fill="#0b1220" stroke="#22c55e" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="h" x="880" y="216" text-anchor="middle" fill="#f0fdf4">Right: what DPNEURIFYFV adds</text>
  <text class="b" x="880" y="252" text-anchor="middle" fill="#d1fae5">1) Symbolic interval propagation with fresh variables</text>
  <text class="b" x="880" y="276" text-anchor="middle" fill="#d1fae5">2) Branch-and-bound splitting where bounds leak most</text>
  <text class="b" x="880" y="300" text-anchor="middle" fill="#d1fae5">3) Tighter upper bound on the verification objective</text>

  <rect x="676" y="355" width="122" height="122" rx="14" ry="14" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.4"/>
  <rect x="830" y="355" width="122" height="122" rx="14" ry="14" fill="#2563eb" stroke="#93c5fd" stroke-width="1.4"/>
  <rect x="984" y="355" width="122" height="122" rx="14" ry="14" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="737" y="428" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#dbeafe" text-anchor="middle">split A</text>
  <text x="891" y="428" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#dbeafe" text-anchor="middle">split B</text>
  <text x="1045" y="428" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#dbeafe" text-anchor="middle">split C</text>
  <path d="M798 416 L830 416" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <path d="M952 416 L984 416" stroke="#93c5fd" stroke-width="4" fill="none"/>

  <text class="m" x="880" y="532" text-anchor="middle">goal: tighten UB of max_x c^T f(x) + b</text>
  <text class="b" x="880" y="560" text-anchor="middle" fill="#d1fae5">Soundness is preserved; precision improves where it matters.</text>
</svg>
