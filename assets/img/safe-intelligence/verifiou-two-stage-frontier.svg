<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="VerifIoU two-stage pipeline and geometric frontier">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1324"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <style>
      .title { font: 700 32px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .sub { font: 400 18px 'Segoe UI', system-ui, sans-serif; fill: #d1fae5; }
      .h { font: 650 21px 'Segoe UI', system-ui, sans-serif; fill: #f0fdf4; }
      .b { font: 400 15px 'Segoe UI', system-ui, sans-serif; fill: #dcfce7; }
      .m { font: 600 15px Consolas, 'Courier New', monospace; fill: #fde68a; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1085" cy="100" r="170" fill="#10b981" opacity="0.1"/>
  <circle cx="110" cy="620" r="220" fill="#22c55e" opacity="0.08"/>
  <text class="title" x="600" y="80" text-anchor="middle">VerifIoU: from box bounds to certified IoU quality</text>
  <text class="sub" x="600" y="116" text-anchor="middle">Task-level guarantee for detection, with a clear geometric next frontier.</text>

  <rect x="70" y="182" rx="16" ry="16" width="255" height="216" fill="url(#card)" stroke="#38bdf8" stroke-width="2.1" filter="url(#shadow)"/>
  <text class="h" x="198" y="234" text-anchor="middle">Step 1</text>
  <text class="b" x="198" y="267" text-anchor="middle">Bound detector outputs under</text>
  <text class="b" x="198" y="289" text-anchor="middle">input perturbation set Omega.</text>
  <text class="m" x="198" y="333" text-anchor="middle">z_i in [l_i, u_i], i=0..3</text>

  <rect x="390" y="182" rx="16" ry="16" width="255" height="216" fill="url(#card)" stroke="#22c55e" stroke-width="2.1" filter="url(#shadow)"/>
  <text class="h" x="518" y="234" text-anchor="middle">Step 2</text>
  <text class="b" x="518" y="267" text-anchor="middle">Compute IoU bounds over</text>
  <text class="b" x="518" y="289" text-anchor="middle">the reachable box set.</text>
  <text class="m" x="518" y="333" text-anchor="middle">min IoU_gt(b), b in B</text>

  <rect x="710" y="182" rx="16" ry="16" width="420" height="216" fill="url(#card)" stroke="#a78bfa" stroke-width="2.1" filter="url(#shadow)"/>
  <text class="h" x="920" y="234" text-anchor="middle">Frontier beyond current VerifIoU</text>
  <text class="b" x="920" y="264" text-anchor="middle">Co-transform predictions and reference geometry</text>
  <text class="b" x="920" y="286" text-anchor="middle">under shared geometric parameters kappa.</text>
  <text class="m" x="920" y="316" text-anchor="middle">min_k IoU(b_pred(k), b_gt(k))</text>
  <text class="b" x="920" y="345" text-anchor="middle">Practical shape support: polygon or mask approximations.</text>

  <path d="M325 291 L390 291" stroke="#34d399" stroke-width="3.1" fill="none" marker-end="url(#arrow)"/>
  <path d="M645 291 L710 291" stroke="#34d399" stroke-width="3.1" fill="none" marker-end="url(#arrow)"/>

  <rect x="70" y="468" rx="16" ry="16" width="1060" height="174" fill="#071310" stroke="#4b5563" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="514" font-family="'Segoe UI', system-ui, sans-serif" font-size="21" font-weight="650" fill="#f0fdf4" text-anchor="middle">Why this matters for safe computer vision</text>
  <text class="b" x="600" y="546" text-anchor="middle">A detector may keep the right class while localization quality collapses.</text>
  <text class="b" x="600" y="570" text-anchor="middle">IoU-based certificates align guarantees with operational usefulness.</text>
  <text class="b" x="600" y="594" text-anchor="middle">The next challenge is jointly transformation-aware and metric-aware verification.</text>
</svg>
